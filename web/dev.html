<!doctype html>
<html><head><meta charset="utf-8"><title>civ-wasm dev</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head><body>
<canvas id="canvas" tabindex="-1"></canvas>
<script>
var Module = {
  canvas: document.getElementById('canvas'),
  print: t => console.log(t), printErr: t => console.warn(t),
  onRuntimeInitialized() {
    FS.mkdir('/saves');
    FS.mount(IDBFS, {}, '/saves');
    FS.syncfs(true, () => { start(); setInterval(() => FS.syncfs(false, () => {}), 2000); });
  },
};
function start() {
    const q = new URLSearchParams(location.search), args = ['-d', '/civ', '-s', '/saves', '--skip-quiz'];
    if (q.get('screen')) args.push('--screen', q.get('screen'));
    if (q.get('filter')) args.push('--filter', q.get('filter'));
    if (q.get('autosave')) args.push('--autosave', q.get('autosave'));
    if (q.has('continue')) args.push('--continue');
    window.civResize = (w, h) => Module._civwasm_request_screen(w, h);
    Module.callMain(args);
}
</script>
<script src="reciv.js"></script>
</body></html>
