name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build with Visual Studio 2026
        shell: pwsh
        run: ./tools/build-msvc.ps1 -VisualStudio 2026
      - name: Run portable tests
        shell: pwsh
        run: ctest --test-dir build-msvc -C Release --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reciv-windows-x86_64
          path: build-msvc/reciv-windows-msvc-x86_64.zip

  # Pushing a tag such as v0.1.0 publishes the zip as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reciv-windows-x86_64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv reciv-windows-msvc-x86_64.zip reciv-windows-x86_64.zip
          gh release create "$GITHUB_REF_NAME" reciv-windows-x86_64.zip \
            --repo "$GITHUB_REPOSITORY" --title "reciv $GITHUB_REF_NAME" --generate-notes
