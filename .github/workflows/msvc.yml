name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build with Visual Studio 2026
        shell: pwsh
        run: ./tools/build-msvc.ps1 -VisualStudio 2026
      - name: Run portable tests
        shell: pwsh
        run: ctest --test-dir build-msvc -C Release --output-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reciv-windows-msvc-x86_64
          path: build-msvc/reciv-windows-msvc-x86_64.zip
