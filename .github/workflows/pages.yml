# civ-wasm: build the WebAssembly game and publish it to GitHub Pages.
# main is the site's root; the wide-map branch, while it exists, is a
# preview under /wide/. The site holds no game files; players import their own.
name: Pages

on:
  push:
    branches: [main, wide-map]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Check for the preview branch
        id: preview
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" wide-map >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.preview.outputs.exists == 'true'
        with:
          ref: wide-map
          path: wide
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.13
          "$HOME/emsdk/emsdk" activate 6.0.13
      - name: Build main
        run: main/tools/wasm/build.sh
      - name: Build the preview
        if: steps.preview.outputs.exists == 'true'
        run: wide/tools/wasm/build.sh
      - name: Assemble the site
        run: |
          mkdir site
          cp -r main/build-web/site/. site/
          if [ -d wide/build-web/site ]; then
            mkdir site/wide
            cp -r wide/build-web/site/. site/wide/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
