# civ-wasm: build the WebAssembly game and publish it to GitHub Pages.
# main is the site's root; the dev and mobile branches, while they exist,
# are previews under /dev/ and /mobile/. The site holds no game files; players import their own.
name: Pages

on:
  push:
    branches: [main, dev, mobile]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Check for the preview branches
        id: preview
        run: |
          for b in dev mobile; do
            if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" $b >/dev/null; then
              echo "$b=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: actions/checkout@v4
        if: steps.preview.outputs.dev == 'true'
        with:
          ref: dev
          path: dev
      - uses: actions/checkout@v4
        if: steps.preview.outputs.mobile == 'true'
        with:
          ref: mobile
          path: mobile
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.13
          "$HOME/emsdk/emsdk" activate 6.0.13
      - name: Build main
        run: main/tools/wasm/build.sh
      - name: Build the previews
        run: |
          for b in dev mobile; do
            if [ -d $b ]; then $b/tools/wasm/build.sh; fi
          done
      - name: Assemble the site
        run: |
          mkdir site
          cp -r main/build-web/site/. site/
          for b in dev mobile; do
            if [ -d $b/build-web/site ]; then
              mkdir site/$b
              cp -r $b/build-web/site/. site/$b/
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
